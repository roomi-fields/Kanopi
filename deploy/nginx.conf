server {
  listen 80;
  server_name _;
  # Volume-served model: the host bind-mounts /var/www/kanopi at
  # /usr/share/nginx/html, where `current` is a symlink to the live release
  # (releases/<timestamp>/). Pointing root at the symlink means an atomic
  # rollback = re-pointing `current`; nginx resolves it per request (no
  # open_file_cache), so a symlink swap is picked up without a container
  # recreate. The release dir holds the build under kanopi/ so that the URL
  # base path /kanopi/ maps straight onto the filesystem.
  root /usr/share/nginx/html/current;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;

  # Versioned assets (hash in filename): long cache
  location ~* ^/kanopi/assets/.*\.(js|css|woff2?|png|jpe?g|gif|svg|webp|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Service worker scripts: never cache (so testers don't get stuck on old versions)
  location ~* ^/kanopi/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # PWA manifest: force the correct Content-Type AND never cache. nginx:alpine's
  # bundled mime.types can serve `.webmanifest` as application/octet-stream, which
  # makes the browser reject the manifest and breaks "install as app". `types { }`
  # clears the inherited type table for this one file so `default_type` wins —
  # version-independent. (This is the fix that was applied by hand on the VPS;
  # carried into the repo so a fresh deploy ships it.)
  location = /kanopi/manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback: every unmatched /kanopi/ path serves the app shell so client
  # routing works on reload / shared deep links.
  location /kanopi/ {
    try_files $uri $uri/ /kanopi/index.html;
  }
}
