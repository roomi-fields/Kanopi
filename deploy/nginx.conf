server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;

  # Versioned assets (hash in filename): long cache
  location ~* ^/kanopi/assets/.*\.(js|css|woff2?|png|jpe?g|gif|svg|webp|wasm)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Service worker + manifest: never cache (so testers don't get stuck on old versions)
  location ~* ^/kanopi/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA fallback
  location /kanopi/ {
    try_files $uri $uri/ /kanopi/index.html;
  }
}
